<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms — Triggered Short</title>
<style>
:root{
  --ink:#12355B; --body:#1B2430; --muted:#5A6472; --rule:#DCE2E8;
  --panel:#F4F7FA; --accent:#B3202C; --gold:#C8922A; --teal:#1B7F79;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
     color:var(--body);background:#fff}
a{color:var(--ink)}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.side{display:none}.side.open{display:block}}

/* ---------- market status bar ---------- */
.mkt{display:flex;align-items:center;gap:11px;padding:11px 16px;border-radius:5px;
 margin:0 0 14px;font:14px/1.45 Helvetica,Arial,sans-serif}
.mkt.closed{background:#F2F4F6;border:1px solid #C9D0D8;color:#3A4551}
.mkt.early{background:#FDF6E7;border:1px solid #E8CE93;color:#7A5B14}
.mkt .dot{width:15px;height:15px;border-radius:50%;flex:0 0 15px}
.mkt.closed .dot{background:#8A93A0;animation:pulseGrey 2.2s ease-in-out infinite}
.mkt.early .dot{background:#C8922A;animation:pulseGold 1.4s ease-in-out infinite}
@keyframes pulseGrey{0%,100%{box-shadow:0 0 0 0 rgba(138,147,160,.55)}
 50%{box-shadow:0 0 0 7px rgba(138,147,160,0)}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(200,146,42,.65)}
 50%{box-shadow:0 0 0 8px rgba(200,146,42,0)}}
/* ---------- industry + patents ---------- */
.ip{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid #EDF1F4}
.ip .cell{padding:13px 16px}
.ip .cell+.cell{border-left:1px solid #EDF1F4}
.ip h4{margin:0 0 6px;font:700 11px Helvetica,Arial,sans-serif;letter-spacing:.10em;
 text-transform:uppercase;color:#12355B}
.ip .big{font:800 21px Helvetica,Arial,sans-serif;color:#12355B;line-height:1.15}
.ip .big small{font:600 13px Helvetica,Arial,sans-serif;color:#5A6472}
.ip .sub{font-size:13px;color:#1B2430;margin-top:4px;line-height:1.5}
.ip .tiny{font-size:11.5px;color:#5A6472;margin-top:6px;line-height:1.5;font-style:italic}
.ip .warn{color:#8E1922;font-style:normal;font-weight:600}
@media(max-width:640px){.ip{grid-template-columns:1fr}.ip .cell+.cell{border-left:0;border-top:1px solid #EDF1F4}}
/* ---------- status labels ---------- */
.stat{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid #EDF1F4;
 background:#FCFDFE}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;
 font:700 12.5px Helvetica,Arial,sans-serif;border:1px solid;cursor:help}
.badge .ar{font-size:13px}
.badge.good{background:#EAF5F4;border-color:#1B7F79;color:#14625D}
.badge.bad{background:#FBEAEC;border-color:#B3202C;color:#8E1922}
.badge.flat{background:#F4F6F8;border-color:#A9B3BF;color:#4A5563}
.badge .dt{font-weight:400;opacity:.85}
.statrule{width:100%;font:12px/1.5 Helvetica,Arial,sans-serif;color:#5A6472;
 margin-top:4px;font-style:italic}
/* ---------- the morning light ---------- */
.tml{display:flex;align-items:center;gap:13px;padding:12px 16px;
 border-top:1px solid #EDF1F4;font:14px/1.45 Helvetica,Arial,sans-serif}
.tml .lamp{width:22px;height:22px;border-radius:50%;flex:0 0 22px;position:relative}
.tml .lamp:after{content:"";position:absolute;inset:0;border-radius:50%}
.tml .k{font:700 11px Helvetica,Arial,sans-serif;letter-spacing:.10em;
 text-transform:uppercase;color:#12355B;display:block;margin-bottom:2px}
.tml .lab{color:#1B2430}
.tml .num{color:#5A6472;font-size:12.5px;margin-top:3px}
.tml.red   .lamp{background:#B3202C;animation:pulseRed 1.15s ease-in-out infinite}
.tml.yellow .lamp{background:#C8922A;animation:pulseGold 1.7s ease-in-out infinite}
.tml.green .lamp{background:#1B7F79;animation:pulseGreen 2.6s ease-in-out infinite}
.tml.grey  .lamp{background:#8A93A0}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(179,32,44,.7)}
 50%{box-shadow:0 0 0 10px rgba(179,32,44,0)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(27,127,121,.5)}
 50%{box-shadow:0 0 0 8px rgba(27,127,121,0)}}
@media (prefers-reduced-motion: reduce){
 .mkt .dot,.tml .lamp{animation:none !important}
 .mkt.closed .dot,.mkt.early .dot,.tml .lamp{box-shadow:0 0 0 3px rgba(0,0,0,.08)}
}
.mkt b{display:block;font-size:14.5px}
.mkt span{opacity:.9;font-size:13px}
/* ---------- company panel ---------- */
.cpanel{border:1px solid #DCE2E8;border-radius:6px;background:#fff;margin:0 0 16px;overflow:hidden}
.cpanel .ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
 padding:12px 16px;background:#F7F9FB;border-bottom:1px solid #EDF1F4}
.cpanel .ch b{font-size:16px;color:#12355B}
.cpanel .ch .m{font-size:12px;color:#5A6472}
.cpanel .body{padding:14px 16px}
.cpanel h4{margin:0 0 7px;font:700 11px Helvetica,Arial,sans-serif;letter-spacing:.10em;
 text-transform:uppercase;color:#12355B}
.cdesc{font-size:14px;line-height:1.6;color:#1B2430;margin:0 0 6px}
.cfacts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:#5A6472;margin-top:8px}
.cfacts span b{color:#1B2430;font-weight:600}
.offs{width:100%;border-collapse:collapse;font-size:13px;margin-top:2px}
.offs td{padding:6px 8px;border-bottom:1px solid #EDF1F4;vertical-align:top}
.offs tr:last-child td{border-bottom:0}
.offs .nm{font-weight:600;color:#12355B;white-space:nowrap}
.offs .ti{color:#1B2430}
.offs .ex{color:#5A6472;font-size:12px}
.offs .dir{font-size:11px;color:#5A6472}
/* koch */
.koch{border-top:1px solid #EDF1F4;padding:14px 16px;background:#FCFDFE}
.koch .kt{font:800 15px Helvetica,Arial,sans-serif;color:#C8922A;letter-spacing:.02em}
.koch .ks{font-size:14px;color:#1B2430;margin:5px 0 12px}
.kbars{display:flex;align-items:flex-end;gap:26px;height:120px;margin:0 0 6px}
.kbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.kbar .v{font:800 17px Helvetica,Arial,sans-serif;margin-bottom:5px}
.kbar .r{width:100%;border-radius:2px 2px 0 0;min-height:4px}
.kbar .l{font-size:11.5px;color:#5A6472;text-align:center;margin-top:6px;line-height:1.35}
.kgap{font:700 13px Helvetica,Arial,sans-serif;color:#C8922A;margin:4px 0 8px}
.krec{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.krec td{padding:4px 6px;border-bottom:1px solid #F1F4F7}
.krec .w{color:#5A6472;white-space:nowrap}
.krec .a{text-align:right;font-weight:600;color:#12355B;white-space:nowrap}
.kfoot{font-size:11.5px;color:#5A6472;font-style:italic;margin-top:8px}
/* price */
.pw{border-top:1px solid #EDF1F4;padding:14px 16px}
.prow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.plast{font:800 22px Helvetica,Arial,sans-serif;color:#12355B}
.pchg{font:700 14px Helvetica,Arial,sans-serif}
.pchg.up{color:#1B7F79}.pchg.dn{color:#B3202C}
.pranges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pranges button{border:1px solid #DCE2E8;background:#fff;color:#5A6472;
 font:600 12px Helvetica,Arial,sans-serif;padding:4px 10px;border-radius:3px;cursor:pointer}
.pranges button:hover{border-color:#12355B;color:#12355B}
.pranges button.on{background:#12355B;border-color:#12355B;color:#fff}
.pchart{width:100%;height:170px;display:block}
.pmeta{font-size:11.5px;color:#5A6472;margin-top:5px}
/* ---------- sidebar ---------- */
.sidenav{margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.sidenav a{display:block;padding:5px 0;font-size:13px;opacity:.75;text-decoration:none;color:inherit}
.sidenav a:hover{opacity:1;text-decoration:underline}
.side{border-right:1px solid var(--rule);background:var(--panel);padding:16px 14px;overflow-y:auto}
.brand{font:700 17px/1.2 Helvetica,Arial,sans-serif;color:var(--ink);margin:0 0 14px}
.mantra{font-size:11.5px;line-height:1.5;color:var(--muted);margin:-8px 0 14px;
        padding-bottom:12px;border-bottom:1px solid var(--rule)}
.mantra b{display:inline-block;margin-top:4px;letter-spacing:.18em;font-size:10.5px;color:var(--accent)}
.search{display:flex;gap:6px;margin-bottom:14px}
.search input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;font:inherit}
.search button{padding:8px 12px;border:0;background:var(--ink);color:#fff;border-radius:4px;cursor:pointer;font:600 13px Helvetica,Arial}
.grp{font:600 11px Helvetica,Arial;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
     margin:16px 0 6px}
.rm{display:block;padding:7px 9px;border-radius:4px;text-decoration:none;color:var(--body);font-size:14px}
.rm:hover{background:#E9EFF5}
.rm.on{background:var(--ink);color:#fff}
.rm .sub{display:block;font-size:11.5px;color:var(--muted)}
.rm.on .sub{color:#C6D4E2}
.opt{font-size:12px;color:var(--teal)}
/* job creator / destroyer — colour PLUS a symbol and a number, never colour alone */
.jobs{font:600 11.5px Helvetica,Arial;white-space:nowrap}
.jobs.creator  {color:#12604A}
.jobs.destroyer{color:var(--accent)}
.jobs.flat     {color:var(--muted)}
.jobs.unknown  {color:#9AA7B4}
.rm.on .jobs{color:#DCE7F1}
.jobsbox{margin:12px 18px 0;border:1px solid var(--rule);border-radius:4px;padding:11px 14px;font-size:13px}
.jobsbox .v{font:700 14px Helvetica,Arial}
.jobsbox .v.creator{color:#12604A}
.jobsbox .v.destroyer{color:var(--accent)}
.jobsbox .d{color:var(--muted);margin-top:3px;font-size:12.5px}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;height:100vh}
.head{border-bottom:1px solid var(--rule);padding:12px 18px;display:flex;align-items:center;gap:12px}
.head h1{margin:0;font:700 18px Helvetica,Arial;color:var(--ink)}
.head .co{font-size:13px;color:var(--muted)}
.tag{font:600 10px Helvetica,Arial;letter-spacing:.08em;padding:2px 6px;border-radius:3px;
     text-transform:uppercase}
.tag.eq{background:#E4EDF5;color:var(--ink)}
.tag.op{background:#FDF1E3;color:#8A5B10}
.tag.danger{background:#FBE4E6;color:var(--accent)}
.menubtn{display:none;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:6px 9px;cursor:pointer}
@media(max-width:820px){.menubtn{display:block}}

.notice{margin:12px 18px 0;border:1px solid var(--rule);border-left:4px solid var(--gold);
        background:#FFFCF5;padding:10px 14px;border-radius:3px}
.notice.material{border-left-color:var(--accent);background:#FFF6F6}
.notice .n1{font:600 13px Helvetica,Arial;color:var(--ink)}
.notice .n2{font-size:13px;color:var(--muted);margin-top:2px}
.notice a{font-size:12.5px}
.risk{margin:12px 18px 0;background:#FFF6F6;border:1px solid #F0C9CD;color:#7A1620;
      padding:10px 14px;font-size:13px;border-radius:3px}

.stream{flex:1;overflow-y:auto;padding:6px 18px 20px}
.post{padding:11px 0;border-bottom:1px solid #EEF2F6}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.who{font-weight:700;color:var(--ink)}
.badge{font:700 9.5px Helvetica,Arial;letter-spacing:.07em;padding:1px 5px;border-radius:3px;
       background:#E4EDF5;color:var(--ink)}
.badge.pro{background:var(--teal);color:#fff}
.badge.guest{background:#EEF1F4;color:var(--muted)}
.badge.desk{background:var(--ink);color:#fff}
.stamp{font-variant-numeric:tabular-nums}
.sess{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sess.premarket{color:var(--gold)}
.body{margin-top:4px;white-space:pre-wrap}
.detached{color:var(--muted);font-style:italic}
.disc{margin-top:4px;font-size:12px;color:var(--muted);border-left:2px solid var(--rule);padding-left:8px}
.senti{font:700 10px Helvetica,Arial;padding:1px 5px;border-radius:3px}
.senti.bullish{background:#E3F3EC;color:#12604A}
.senti.bearish{background:#FBE4E6;color:var(--accent)}
.del{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}

.slot{margin:14px 0;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.slot .lbl{font:700 9.5px Helvetica,Arial;letter-spacing:.1em;text-transform:uppercase;
           padding:4px 12px;background:var(--panel);color:var(--muted);border-bottom:1px solid var(--rule)}
.slot .in{padding:11px 13px}
.slot h4{margin:0 0 3px;font:700 14px Helvetica,Arial;color:var(--ink)}
.slot p{margin:0;font-size:13.5px;color:var(--body)}
.slot .fine{margin-top:6px;font-size:11.5px;color:var(--muted)}
.slot.house .lbl{background:#E4EDF5;color:var(--ink)}

.composer{border-top:1px solid var(--rule);padding:10px 18px 14px;background:#fff}
.warn{font-size:11.5px;color:var(--accent);margin-bottom:6px}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;min-height:54px;resize:vertical;padding:9px 11px;border:1px solid var(--rule);
               border-radius:4px;font:inherit}
.crow select{padding:8px;border:1px solid var(--rule);border-radius:4px;font:inherit}
.crow button{padding:10px 16px;border:0;background:var(--ink);color:#fff;border-radius:4px;
             cursor:pointer;font:600 14px Helvetica,Arial}
.crow button:disabled{background:#9AA7B4;cursor:not-allowed}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}

.forms{margin:14px 18px;border:1px solid var(--rule);border-radius:4px}
.forms h3{margin:0;padding:9px 13px;font:600 12px Helvetica,Arial;letter-spacing:.06em;
          text-transform:uppercase;color:var(--ink);background:var(--panel);border-bottom:1px solid var(--rule)}
.f{display:flex;justify-content:space-between;gap:12px;padding:9px 13px;border-bottom:1px solid #EEF2F6;font-size:13px}
.f:last-child{border-bottom:0}
.f b{color:var(--ink)}
.f .d{color:var(--muted);font-size:12.5px}
.f .fee{white-space:nowrap;font:600 12px Helvetica,Arial;color:var(--teal)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <aside class="side" id="side">
    <div class="brand">Triggered&nbsp;Short</div>
    <div class="mantra">No geniuses. Just better informed people.<br><b>BE INFORMED</b></div>
    <div class="search">
      <input id="q" placeholder="Symbol, e.g. TOVX" autocomplete="off">
      <button onclick="doSearch()">Go</button>
    </div>
    <div id="rooms"></div>
    <div class="sidenav">
      <a href="/features">Features</a>
      <a href="/glossary">Glossary</a>
      <a href="/admin">Admin</a>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <button class="menubtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div>
        <h1 id="title">General Discussion</h1>
        <div class="co" id="co"></div>
      </div>
      <span id="tags"></span>
    </div>

    <div id="mkt"></div>
    <div id="banner"></div>
    <div id="cpanel"></div>
    <div class="stream" id="stream"><div class="empty">Loading…</div></div>
    <div id="formsBox"></div>

    <div class="composer">
      <div class="warn">
        Your IP is recorded. Posts are permanent after 24 hours. Others may be saving what you write.
      </div>
      <div class="crow">
        <textarea id="msg" placeholder="Say something. Nobody here is anonymous."></textarea>
        <select id="senti">
          <option value="">no call</option>
          <option value="bullish">bullish</option>
          <option value="bearish">bearish</option>
          <option value="neutral">neutral</option>
        </select>
        <button id="send" onclick="send()">Post</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </main>
</div>

<script>
const API = localStorage.getItem('ts_api') || '';        // e.g. https://room.triggeredshort.com
const SESSION = localStorage.getItem('ts_session') || ''; // internal_id for now
let ROOM = 'general:market';

const h = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const api = (p, opt={}) => fetch(API + p, {
  ...opt,
  headers: { 'content-type':'application/json', 'x-session': SESSION, ...(opt.headers||{}) }
}).then(r => r.json());

function stamp(iso, unix){
  const d = new Date(iso || unix*1000);
  const date = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const time = d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  return date + ' · ' + time;
}

/* ---------------- rooms ---------------- */
async function loadRooms(){
  const d = await api('/api/rooms');
  const gen = (d.rooms||[]).filter(r=>r.kind==='general');
  const tick = (d.rooms||[]).filter(r=>r.kind==='ticker');
  const box = document.getElementById('rooms');
  let html = '<div class="grp">Discussion</div>';
  for (const r of gen) html += roomLink(r);
  if (tick.length){
    html += '<div class="grp">Companies</div>';
    for (const r of tick) html += roomLink(r);
  }
  box.innerHTML = html;
}
function jobsTag(r){
  if (!r.verdict || r.verdict === 'unknown') return '';
  const arrow = r.verdict === 'creator' ? '▲' : r.verdict === 'destroyer' ? '▼' : '■';
  const n = r.net_change > 0 ? '+' + r.net_change : r.net_change;
  return ` <span class="jobs ${h(r.verdict)}" title="${h(r.verdict)}: ${h(n)} employees since first filing">${arrow} ${h(n)}</span>`;
}
function roomLink(r){
  const on = r.room_key===ROOM ? ' on' : '';
  const sub = r.company_name || r.description || '';
  const opt = r.room_key.endsWith(':OPTIONS') ? ' <span class="opt">options</span>' : '';
  return `<a class="rm${on}" href="#" onclick="openRoom('${h(r.room_key)}');return false">
            ${h(r.title)}${opt}${jobsTag(r)}<span class="sub">${h(sub)}</span></a>`;
}

async function doSearch(){
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const d = await api('/api/room/search', { method:'POST', body: JSON.stringify({q}) });
  if (d.refused){
    document.getElementById('banner').innerHTML =
      `<div class="risk"><b>${h(d.headline)}</b> — ${h(d.message)}<br><br>
       ${h(d.detail)}<br><br><i>${h(d.what_you_can_do)}</i></div>`;
    document.getElementById('stream').innerHTML = '<div class="empty">No room for this symbol.</div>';
    document.getElementById('title').textContent = q.toUpperCase();
    document.getElementById('tags').innerHTML = '<span class="tag danger">danger zone</span>';
    document.getElementById('co').textContent = '';
    return;
  }
  await loadRooms();
  openRoom(d.room.room_key);
}

/* ---------------- one room ---------------- */
async function openRoom(key){
  ROOM = key;
  document.getElementById('side').classList.remove('open');
  const d = await api('/api/room?key=' + encodeURIComponent(key));
  if (d.error){ document.getElementById('stream').innerHTML='<div class="empty">'+h(d.error)+'</div>'; return; }

  const r = d.room;
  document.getElementById('title').textContent = r.title;
  document.getElementById('co').textContent =
    [r.company_name, r.current_venue].filter(Boolean).join(' · ');
  document.getElementById('tags').innerHTML =
    (r.instrument==='options' ? '<span class="tag op">options</span>'
                              : '<span class="tag eq">equity</span>');

  let banner = '';
  if (r.risk_banner) banner += `<div class="risk">${h(r.risk_banner)}</div>`;
  for (const n of (d.notices||[]).slice(0,3)){
    banner += `<div class="notice${n.is_material?' material':''}">
      <div class="n1">${h(n.form_type||n.source)} — ${h(n.headline)}</div>
      ${n.plain_english?`<div class="n2">${h(n.plain_english)}</div>`:''}
      <div class="n2">${stamp(null,n.filed_at)} · <a href="${h(n.url)}" target="_blank" rel="noopener">open the document</a></div>
    </div>`;
  }
  if (d.jobs && d.jobs.verdict && d.jobs.verdict !== 'unknown'){
    const j = d.jobs;
    const word = j.verdict === 'creator' ? 'Job creator'
               : j.verdict === 'destroyer' ? 'Job destroyer' : 'Flat';
    const arrow = j.verdict === 'creator' ? '▲' : j.verdict === 'destroyer' ? '▼' : '■';
    const n = j.net_change > 0 ? '+' + j.net_change : j.net_change;
    banner += `<div class="jobsbox">
      <span class="v ${h(j.verdict)}">${arrow} ${h(word)}</span>
      &nbsp;${h(n)} employees (${h(j.pct_change)}%)
      <div class="d">${h(j.first_employees)} as of ${h(j.first_as_of)} &rarr;
        ${h(j.latest_employees)} as of ${h(j.latest_as_of)}.
        Counts taken from the company's own filings.</div></div>`;
  }
  document.getElementById('banner').innerHTML = banner;
  loadMarketStatus();
  loadCompany(r.ticker);

  // forms + fees
  let f = '';
  for (const x of (d.forms||[]).slice(0,6)){
    f += `<div class="f"><div><b>${h(x.form_type)}</b> — ${h(x.label)}
            <div class="d">${h(x.plain_english)}</div></div>
          <div class="fee">$${(x.read_fee_cents/100).toFixed(2)} read<br>
            $${(x.agent_fee_cents/100).toFixed(2)} opinion</div></div>`;
  }
  document.getElementById('formsBox').innerHTML = f
    ? `<div class="forms"><h3>Read the filings</h3>${f}</div>` : '';

  await loadStream();
  await loadRooms();
}


/* ============================================================
   THE COMPANY PANEL — profile, officers, How'm I Doin', price
   ============================================================ */
let PRANGE = '1Y';
let PTICKER = null;

function money(m){
  if (m == null) return '—';
  return m >= 1000 ? '$' + (m/1000).toFixed(0) + ' billion'
                   : '$' + (m % 1 ? m.toFixed(1) : m.toFixed(0)) + 'M';
}


/* ---- market status: say it before he trades into a closed day ---- */
async function loadMarketStatus(){
  const el = document.getElementById('mkt');
  if (!el) return;
  let d;
  try { d = await api('/api/market-status'); } catch(e){ el.innerHTML=''; return; }
  if (!d || !d.known || (d.is_open === 1 && d.session !== 'early')){ el.innerHTML=''; return; }

  if (d.is_open === 0){
    el.innerHTML = `<div class="mkt closed"><span class="dot"></span><div>
      <b>The market is closed today${d.reason?' — '+h(d.reason):''}.</b>
      <span>No regular trading and no closing price for ${h(d.date)}.
      Anything you place today fills in the next session.</span></div></div>`;
  } else {
    el.innerHTML = `<div class="mkt early"><span class="dot"></span><div>
      <b>Short session today${d.early_close?' — the market closes at '+h(d.early_close):''}.</b>
      <span>${h(d.reason||'')} Volume is usually thin and the close is set hours early.</span>
      </div></div>`;
  }
}

async function loadCompany(ticker){
  const box = document.getElementById('cpanel');
  if (!ticker){ box.innerHTML = ''; PTICKER = null; return; }
  PTICKER = ticker;
  box.innerHTML = '<div class="cpanel"><div class="body" style="color:#5A6472">Loading…</div></div>';

  let d;
  try { d = await api('/api/company/' + encodeURIComponent(ticker)); }
  catch(e){ box.innerHTML = ''; return; }
  if (!d || d.error){ box.innerHTML = ''; return; }

  const p = d.profile || {};
  let html = '<div class="cpanel">';

  html += `<div id="stat" class="stat"></div>`;
  html += `<div class="ch"><b>${h(p.legal_name || ticker)}</b>
    <span class="m">${[p.sector,p.industry,p.hq].filter(Boolean).map(h).join(' · ')}</span></div>`;

  /* ---- description + facts ---- */
  html += '<div class="body">';
  if (p.description) html += `<p class="cdesc">${h(p.description)}</p>`;
  else if (d.profile_is_stub)
    html += `<p class="cdesc" style="color:#5A6472">No profile written yet for ${h(ticker)}.</p>`;
  const f = [];
  if (p.cik) f.push(`<span>CIK <b>${h(p.cik)}</b></span>`);
  if (p.exchange || p.current_venue) f.push(`<span>Listed <b>${h(p.exchange||p.current_venue)}</b></span>`);
  if (p.incorporated_in) f.push(`<span>Incorporated <b>${h(p.incorporated_in)}</b></span>`);
  if (p.employees != null) f.push(`<span>Employees <b>${h(p.employees)}</b>${p.employees_as_of?' as of '+h(p.employees_as_of):''}</span>`);
  if (p.edgar_url) f.push(`<span><a href="${h(p.edgar_url)}" target="_blank" rel="noopener">All filings on EDGAR</a></span>`);
  if (f.length) html += `<div class="cfacts">${f.join('')}</div>`;
  html += '</div>';
  html += `<div id="ip"></div>`;

  /* ---- officers ---- */
  if (d.officers && d.officers.length){
    html += '<div class="body" style="border-top:1px solid #EDF1F4"><h4>Officers and directors</h4><table class="offs">';
    for (const o of d.officers){
      const roles = [];
      if (o.is_officer) roles.push('officer');
      if (o.is_director) roles.push('director');
      html += `<tr><td class="nm">${h(o.person_name)}</td>
        <td class="ti">${h(o.title)}
          ${o.since_year?`<span class="dir"> · since ${h(o.since_year)}</span>`:''}
          <span class="dir"> · ${roles.join(' and ')}</span>
          ${o.also_serves?`<div class="ex">Also serves: ${h(o.also_serves)}</div>`:''}
          ${o.note?`<div class="ex">${h(o.note)}</div>`:''}</td>
        <td class="a" style="text-align:right;white-space:nowrap">
          ${o.comp_last_year?('$'+Number(o.comp_last_year).toLocaleString()+(o.comp_year?'<div class="dir">'+h(o.comp_year)+'</div>':'')):''}</td></tr>`;
    }
    html += '</table>';
    html += '<div class="kfoot">Taken from the company\u2019s own proxy statement and annual report.</div></div>';
  }

  /* ---- How'm I Doin' ---- */
  if (d.koch){
    const k = d.koch;
    const returned = k.direction === 'returned';
    const left  = returned ? k.returned_musd : k.raised_musd;
    const right = k.marketcap_musd;
    const top   = Math.max(left||0, right||0) || 1;
    const lcol  = returned ? '#1B7F79' : '#12355B';
    const rcol  = returned ? '#1B7F79' : '#B3202C';
    const sentence = returned
      ? `${h(p.short_name||ticker)} did not take money from investors. It gave ${money(left)} back.`
      : `Investors put in ${money(left)}${k.is_floor?' at least':''}. What is left is worth ${money(right)}.`;

    html += `<div class="koch"><div class="kt">HOW'M I DOIN'?</div>
      <div class="ks">${sentence}</div>
      <div class="kbars">
        <div class="kbar"><div class="v" style="color:${lcol}">${money(left)}</div>
          <div class="r" style="background:${lcol};height:${(left/top*88).toFixed(0)}px"></div>
          <div class="l">${returned?'Returned TO investors':'Raised FROM investors'}${k.since_year?'<br>since '+k.since_year:''}</div></div>
        <div class="kbar"><div class="v" style="color:${rcol}">${money(right)}</div>
          <div class="r" style="background:${rcol};height:${(right/top*88).toFixed(0)}px"></div>
          <div class="l">What the whole company<br>is worth today</div></div>
      </div>`;
    if (k.gap_musd != null)
      html += `<div class="kgap">${money(k.gap_musd)} gone &mdash; ${k.gap_pct}% of every dollar put in</div>`;
    if (d.receipts && d.receipts.length){
      html += '<h4 style="margin-top:12px">The receipts</h4><table class="krec">';
      for (const r of d.receipts)
        html += `<tr><td class="w">${h(r.when_label)}</td><td>${h(r.what)}</td>
                 <td class="a">${h(r.amount_label||'')}</td></tr>`;
      html += '</table>';
    }
    if (k.footnote) html += `<div class="kfoot">${h(k.footnote)}</div>`;
    html += `<div class="kfoot"><a href="/howm-i-doin" target="_blank" rel="noopener">How this is measured, and why every company gets one</a></div>`;
    html += '</div>';
  }

  /* ---- price ---- */
  html += `<div class="pw">
    <div class="prow">
      <span class="plast" id="pLast">—</span>
      <span class="pchg" id="pChg"></span>
      <span class="pranges" id="pRanges">
        ${['5D','1M','6M','1Y','5Y','ALL'].map(r=>
          `<button data-r="${r}" class="${r===PRANGE?'on':''}">${r}</button>`).join('')}
      </span>
    </div>
    <svg class="pchart" id="pChart" viewBox="0 0 600 170" preserveAspectRatio="none"></svg>
    <div class="pmeta" id="pMeta"></div>
  </div>
  <div id="tml"></div>`;

  html += '</div>';
  box.innerHTML = html;

  document.getElementById('pRanges').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    PRANGE = b.dataset.r;
    document.querySelectorAll('#pRanges button').forEach(x=>x.classList.toggle('on', x===b));
    loadPrices();
  });
  loadPrices();
  loadMorningLight(ticker);
  loadStatus(ticker);
  loadIndustry(ticker);
}

/* ---- INDUSTRY AND PATENTS ---- */
async function loadIndustry(ticker){
  const box = document.getElementById('ip');
  if (!box || !ticker) return;
  let d;
  try { d = await api('/api/industry/' + encodeURIComponent(ticker)); }
  catch(e){ box.innerHTML=''; return; }
  if (!d || (!d.industry && !d.patents)){ box.innerHTML=''; return; }

  const i = d.industry || {}, p = d.patents;
  let left = '<div class="cell"><h4>What business it is in</h4>';
  if (i.sic_title){
    left += `<div class="big">${h(i.sic_title)}</div>`;
    if (i.sic) left += `<div class="sub">SEC classification ${h(i.sic)}${i.sic_office?' &middot; '+h(i.sic_office):''}</div>`;
    if (i.sic_plain) left += `<div class="tiny">${h(i.sic_plain)}</div>`;
  } else {
    left += `<div class="sub" style="color:#5A6472">Not classified yet.</div>`;
  }
  left += '</div>';

  let right = '<div class="cell"><h4>Patents alive</h4>';
  if (p && p.total_found){
    right += `<div class="big">${p.live || 0}<small> live of ${p.total_found} found</small></div>`;
    const bits = [];
    if (p.live_us)      bits.push(`${p.live_us} in the United States`);
    if (p.live_foreign) bits.push(`${p.live_foreign} elsewhere`);
    if (p.dead)         bits.push(`${p.dead} expired or lapsed`);
    if (p.unknown)      bits.push(`${p.unknown} unverified`);
    if (bits.length) right += `<div class="sub">${bits.join(' &middot; ')}</div>`;
    if (p.first_expiry)
      right += `<div class="sub">First one expires ${h(p.first_expiry)}</div>`;
    if (p.expiring_within_3y)
      right += `<div class="sub warn">${p.expiring_within_3y} expire within three years</div>`;
    if (d.note && d.note.caveat) right += `<div class="tiny">${h(d.note.caveat)}</div>`;
    if (d.assignees && d.assignees.length)
      right += `<div class="tiny">Counted under: ${d.assignees.map(a=>h(a.assignee_name)).join(' &middot; ')}</div>`;
  } else {
    right += `<div class="sub" style="color:#5A6472">No patent search run for this company yet.</div>`;
    if (d.assignees && d.assignees.length)
      right += `<div class="tiny">Names to search: ${d.assignees.map(a=>h(a.assignee_name)).join(' &middot; ')}</div>`;
  }
  right += '</div>';

  box.innerHTML = `<div class="ip">${left}${right}</div>`;
}

async function loadStatus(ticker){
  const box = document.getElementById('stat');
  if (!box || !ticker) return;
  let d;
  try { d = await api('/api/status/' + encodeURIComponent(ticker)); }
  catch(e){ box.innerHTML=''; return; }
  if (!d || !d.labels || !d.labels.length){ box.innerHTML=''; return; }
  const arrow = t => t==='good' ? '\u25B2' : t==='bad' ? '\u25BC' : '\u25A0';
  let s = '';
  for (const L of d.labels)
    s += `<span class="badge ${h(L.tone)}" title="${h(L.rule)}">
            <span class="ar">${arrow(L.tone)}</span>${h(L.text)}
            <span class="dt">&middot; ${h(L.detail)}</span></span>`;
  if (d.authority) s += `<div class="statrule">${h(d.authority)}</div>`;
  box.innerHTML = s;
}

async function loadMorningLight(ticker){
  const box = document.getElementById('tml');
  if (!box || !ticker) return;
  let d;
  try { d = await api('/api/morning/' + encodeURIComponent(ticker)); }
  catch(e){ box.innerHTML=''; return; }
  if (!d || d.error || !d.light){ box.innerHTML=''; return; }

  let num = '';
  if (d.light !== 'grey' && d.pct_volume_underwater != null){
    num = `<div class="num">${d.pct_volume_underwater}% of this morning\u2019s volume`
        + ` traded above the current price`
        + (d.vol_above_noon ? ` \u00b7 ${Number(d.vol_above_noon).toLocaleString()} shares` : '')
        + `</div>`;
  }
  box.innerHTML = `<div class="tml ${h(d.light)}"><span class="lamp"></span><div>
      <span class="k">This morning &middot; ${h(d.window_from||'7:00')}&ndash;${h(d.window_to||'12:00')} ET</span>
      <span class="lab">${h(d.label||'')}</span>${num}
      <div class="num" style="font-style:italic">${h(d.disclaimer||'')}</div>
    </div></div>`;
}

async function loadPrices(){
  if (!PTICKER) return;
  const svg  = document.getElementById('pChart');
  const meta = document.getElementById('pMeta');
  if (!svg) return;
  let d;
  try { d = await api('/api/prices/' + encodeURIComponent(PTICKER) + '?range=' + PRANGE); }
  catch(e){ meta.textContent = 'No price history loaded for this symbol yet.'; return; }

  const s = (d.series||[]).filter(r => r.close != null);
  if (s.length < 2){
    svg.innerHTML = '';
    meta.textContent = 'No price history loaded for this symbol yet.';
    document.getElementById('pLast').textContent = '—';
    document.getElementById('pChg').textContent = '';
    return;
  }

  const W=600, H=170, PAD=6;
  const vals = s.map(r=>r.close);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi-lo) || (hi||1)*0.02;
  const x = i => PAD + i*(W-2*PAD)/(s.length-1);
  const y = v => H-PAD - ((v-lo)/span)*(H-2*PAD);

  const up = d.change >= 0;
  const col = up ? '#1B7F79' : '#B3202C';
  let path = s.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(r.close).toFixed(1)).join(' ');
  const area = path + ` L ${x(s.length-1).toFixed(1)} ${H-PAD} L ${PAD} ${H-PAD} Z`;

  svg.innerHTML =
    `<path d="${area}" fill="${col}" opacity="0.10"></path>` +
    `<path d="${path}" fill="none" stroke="${col}" stroke-width="2"
           vector-effect="non-scaling-stroke"></path>`;

  const fmt = v => '$' + (v < 1 ? v.toFixed(3) : v.toFixed(2));
  document.getElementById('pLast').textContent = fmt(d.last);
  const chg = document.getElementById('pChg');
  chg.className = 'pchg ' + (up?'up':'dn');
  chg.textContent = (up?'▲ +':'▼ ') + (d.change!=null?d.change.toFixed(4).replace(/0+$/,'').replace(/\.$/,''):'') +
                    '  (' + (d.change_pct!=null?(up?'+':'')+d.change_pct+'%':'') + ')  over ' + PRANGE;
  meta.textContent = `${s.length} sessions · low ${fmt(lo)} · high ${fmt(hi)} · closing prices as reported`;
}

async function loadStream(){
  const d = await api('/api/stream?room=' + encodeURIComponent(ROOM) + '&limit=60');
  const s = document.getElementById('stream');
  if (!d.items || !d.items.length){
    s.innerHTML = '<div class="empty">Nothing here yet. Say the first thing.</div>';
    return;
  }
  s.innerHTML = d.items.map(render).join('');
  s.scrollTop = s.scrollHeight;
}

function render(it){
  if (it.kind === 'ad'){
    return `<div class="slot"><div class="lbl">Advertisement</div><div class="in">
      <h4>${h(it.headline)}</h4><p>${h(it.body)}</p>
      <p style="margin-top:7px"><a href="${h(it.cta_url)}" target="_blank" rel="noopener sponsored"
         onclick="adClick('${h(it.id)}')">${h(it.cta_text||'Learn more')}</a></p>
      <div class="fine">${h(it.disclosure)}</div></div></div>`;
  }
  if (it.kind === 'house'){
    return `<div class="slot house"><div class="lbl">From Triggered Short</div><div class="in">
      <h4>${h(it.headline)}</h4>${it.summary?`<p>${h(it.summary)}</p>`:''}
      <p style="margin-top:7px"><a href="${h(it.url)}">Read it</a></p></div></div>`;
  }
  const a = it.author || {};
  const badge = a.detached ? '' :
    (a.type === 'professional' ? '<span class="badge pro">PRO</span>'
     : a.type === 'guest'      ? '<span class="badge guest">GUEST</span>'
     : a.type === 'contributor'|| a.type === 'staff' ? '<span class="badge desk">DESK</span>' : '');
  const who = a.detached ? '<span class="who detached">A verified user</span>'
                         : `<span class="who">${h(a.display||'—')}</span>`;
  const senti = it.sentiment ? `<span class="senti ${h(it.sentiment)}">${h(it.sentiment)}</span>` : '';
  const canDel = !a.detached && (Date.now()/1000 - it.at) < 86400;
  return `<div class="post">
    <div class="meta">${who}${badge}
      ${a.firm?`<span>${h(a.firm)}</span>`:''}
      <span class="stamp">${stamp(it.timestamp_utc, it.at)}</span>
      <span class="sess ${h(it.session)}">${h(it.session)}</span>
      ${it.position?`<span>declared ${h(it.position)}</span>`:''}
      ${senti}
      ${canDel?`<button class="del" onclick="del('${h(it.id)}')">delete</button>`:''}
    </div>
    <div class="body">${h(it.body)}</div>
    ${a.disclosure?`<div class="disc">${h(a.disclosure)}</div>`:''}
    ${it.promotional?`<div class="disc"><b>Promotional.</b> Posted by a professional account.</div>`:''}
  </div>`;
}

async function send(){
  const t = document.getElementById('msg');
  const body = t.value.trim();
  if (!body) return;
  const btn = document.getElementById('send'); btn.disabled = true;
  const d = await api('/api/post', { method:'POST', body: JSON.stringify({
    room_key: ROOM, body, sentiment: document.getElementById('senti').value || null }) });
  btn.disabled = false;
  const hint = document.getElementById('hint');
  if (d.error){ hint.textContent = d.error; return; }
  t.value = '';
  hint.textContent = d.note ? d.note
    : (d.remaining_today !== null && d.remaining_today !== undefined
        ? d.remaining_today + ' posts left today' : '');
  loadStream();
}

async function del(id){
  if (!confirm('Remove your name from this post?\n\nThe post itself stays in the record. This cannot be undone.')) return;
  const d = await api('/api/post/delete', { method:'POST', body: JSON.stringify({post_id:id}) });
  document.getElementById('hint').textContent = d.note || d.error || '';
  loadStream();
}

function adClick(id){
  api('/api/ad/click', { method:'POST', body: JSON.stringify({campaign_id:id, ticker:ROOM}) });
}

document.getElementById('q').addEventListener('keydown', e => { if (e.key==='Enter') doSearch(); });
document.getElementById('msg').addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key==='Enter') send();
});

loadRooms().then(()=>openRoom(ROOM));
setInterval(loadStream, 8000);
