<!-- BUILT 2026-09-30 · 8k10q desk-1a · THE DESK: Mark approves or declines people who applied to join the room. Needs the room's admin token (ADMIN_TOKEN on triggeredshort-room); kept only for this browser tab. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The desk: approve members — 8K10Q</title>
<style>
:root{--ink:#14150f;--ink2:#4a4b43;--line:#ddddd5;--navy:#1a1f6b;--ok:#0E8A55;--no:#8a2a2a;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 var(--sans);color:var(--ink);background:#f6f6f2}
.wrap{max-width:760px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--ink2);margin:0 0 12px}
.row{display:flex;gap:8px;margin:12px 0}input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
button{border:0;border-radius:8px;padding:10px 16px;font:700 15px var(--sans);color:#fff;background:var(--navy);cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.card b{font-size:17px}.card small{display:block;color:var(--ink2);margin:2px 0 10px}
.yes{background:var(--ok)}.no{background:var(--no)}.done{color:var(--ink2);font-size:14px}
</style>
</head>
<body><div class="wrap">
<h1>The desk</h1>
<p>People who applied to join the 8K10Q room. Approve and they can post under their real name; decline and they can&rsquo;t. Nothing is deleted.</p>
<div class="row"><input id="tok" type="password" placeholder="Room admin token" autocomplete="off"><button id="load">Show who&rsquo;s waiting</button></div>
<div id="list"></div>
<p class="done" style="margin-top:24px">Built 2026-09-30 &middot; desk-1a</p>
</div>
<script>
(function () {
  var ROOM = "https://triggeredshort-room.realroofers.workers.dev";
  var tok = document.getElementById("tok"), list = document.getElementById("list");
  try { tok.value = sessionStorage.getItem("k8_desk") || ""; } catch (e) {}
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function load() {
    try { sessionStorage.setItem("k8_desk", tok.value); } catch (e) {}
    fetch(ROOM + "/api/admin/applicants", { headers: { "x-admin-token": tok.value } }).then(function (r) {
      if (r.status === 401) throw new Error("That token isn't right.");
      return r.json();
    }).then(function (d) {
      var items = d.items || [];
      if (!items.length) { list.innerHTML = '<div class="card">Nobody is waiting. Nice.</div>'; return; }
      list.innerHTML = items.map(function (u) {
        return '<div class="card" id="u' + esc(u.internal_id) + '"><b>' + esc(u.handle) + '</b>'
          + '<small>' + esc(u.state_region || "") + (u.country ? " · " + esc(u.country) : "") + " · " + esc(u.email) + " · " + esc(u.phone || "")
          + " · applied " + esc(new Date(u.applied_at * 1000).toLocaleString()) + '</small>'
          + '<button class="yes" data-id="' + esc(u.internal_id) + '" data-ok="1">Approve</button> '
          + '<button class="no" data-id="' + esc(u.internal_id) + '" data-ok="0">Decline</button></div>';
      }).join("");
    }).catch(function (e) { list.innerHTML = '<div class="card">' + esc(e.message) + '</div>'; });
  }
  document.getElementById("load").addEventListener("click", load);
  list.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]"); if (!b) return;
    var ok = b.dataset.ok === "1";
    fetch(ROOM + "/api/admin/approve", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-token": tok.value },
      body: JSON.stringify({ internal_id: b.dataset.id, approve: ok }) }).then(function (r) {
      var c = document.getElementById("u" + b.dataset.id);
      if (c) c.outerHTML = '<div class="card done">' + (r.ok ? (ok ? "Approved: they can post now." : "Declined.") : "Could not save. Try again.") + '</div>';
    });
  });
  if (tok.value) load();
})();
</script>
</body></html>
