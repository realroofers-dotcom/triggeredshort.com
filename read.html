<script>
(function () {
  var READ = "https://read.realroofers.workers.dev", PAY = "https://pay.realroofers.workers.dev";

    if (a) a.innerHTML = FLOW.lines.length ? '&#9654; ' + CHECKS[FLOW.c % CHECKS.length] + '&hellip;' : '';

  setInterval(function () {
    if (FLOW.lines.length) { FLOW.shown.push(FLOW.lines[FLOW.i % FLOW.lines.length]); FLOW.i++; if (FLOW.shown.length > 6) FLOW.shown.shift(); }

  }
  /* live-1a (16 Nov 2026): the first request above MAKES the read and only answers when it is done (1 to 3 minutes), so on

  var shown = false, polls = 0;

    if (shown) return;

      steps: [{ t: "Payment received", state: "done" },
              { t: "Reading the filing, every section, in plain English (usually 1 to 3 minutes)", state: "now", live: j.stage || "Opening the filing" },
              { t: "Your read opens here by itself", state: "next" }] });
  }
  var poller = setInterval(function () {
    if (shown || ++polls > 300) return clearInterval(poller);
    if (polls < 2) return;   /* give the first request a head start */
    fetch(READ + "/?paidread=1&session=" + encodeURIComponent(S) + (ACC ? "&acc=" + encodeURIComponent(ACC) : "") + "&wait=1")

      .then(function (j) {
        if (shown || !j) return;

        if (j.paid) makingView(j);
      }).catch(function () {});
  }, 4000);
  ask(false);

  /* the filing itself, delivered by us (copy-1a, Mark 15 Nov: "we dont want to give them a link to the sec site we

  function copiesBox(j) {

        : (function () { var cur = (j.items || []).filter(function (y) { return y.status !== "ready"; })[0]; feedFlow(cur && cur.lines); return ''; })()
          + progress({ flow: j.ready < j.total, title: "Reading your " + j.total + " report" + (j.total === 1 ? "" : "s") + "&hellip; " + j.ready + " of " + j.total + " done",
            pct: Math.round(100 * (j.ready + 0.5) / (j.total + 1)),

              .concat([{ t: "The summary across " + (j.total === 1 ? "it" : "all of them"), state: j.ready === j.total ? "now" : "next", live: j.ready === j.total ? (j.summary_stage || "Starting the summary") : null }]),

      + '<div class="card"><div class="k">Each report, read on its own</div><ul>'

      + '<div class="lh-c">8k10q.com<br>' + LH.phone + '<br>' + LH.email + '</div></div>'
      + '<div class="meta">Report on <b>' + esc(j.company || t) + ' (' + esc(t) + ')</b> &middot; ' + esc(j.form || "SEC filing") + (j.filed ? ' filed ' + esc(j.filed) : '') + ' &middot; accession ' + esc(j.accession) + (made ? ' &middot; read ' + esc(made) : '')
      + '<br><span class="only">Prepared for one reader only' + (j.for_reader ? ' (' + esc(j.for_reader) + ')' : '') + '. Not to be reposted, forwarded or shared, in whole or in part, including in the 8K10Q chat rooms.</span></div>'
      + '<div class="card head"><div class="k">Headline</div><b>' + esc(r.headline) + '</b><p>' + esc(r.what_this_filing_is || "") + '</p></div>'
      + '<div class="card"><div class="k">In plain English</div><p>' + esc(r.plain_summary) + '</p></div>'
      + sec("People", r.people, function (x) { return '<li><b>' + esc(x.name) + '</b> (' + esc(x.role) + ') &ndash; ' + esc(x.what_they_got_or_did) + (x.quote ? ' <q>' + esc(x.quote) + '</q>' : '') + '</li>'; })
      + '<div class="card"><div class="k">Money</div><dl class="money">' + mrow("Cash", m.cash) + mrow("Raised", m.raised) + mrow("Cost of raising", m.cost_of_raising) + mrow("Debt and amounts owed", m.debt_and_amounts_owed) + mrow("Deferred or unpaid", m.deferred_or_unpaid) + mrow("Costs", m.expenses) + mrow("Revenue", m.revenue) + mrow("Net loss or income", m.net_loss_or_income) + mrow("How long the cash lasts", m.runway) + '</dl>'
      + (m.quote ? '<p><q>' + esc(m.quote) + '</q></p>' : '') + (m.note ? '<p style="color:var(--ink3)">' + esc(m.note) + '</p>' : '') + '</div>'
      + sec("Results the company reports", r.results, function (x) { return '<li>' + esc(x.claim) + (x.quote ? ' <q>' + esc(x.quote) + '</q>' : '') + ' &ndash; how sure the filing is: ' + esc(x.how_strong) + '</li>'; })
      + sec("What the board and officers did", r.actions, function (x) { return '<li>' + (x.date ? esc(x.date) + ' &ndash; ' : '') + esc(x.action) + (x.quote ? ' <q>' + esc(x.quote) + '</q>' : '') + '</li>'; })
      /* warrants: signalled only; the analysis is Warrant Wire's (Mark 14 Nov: 'we are cross selling here'). 20% off because this read was paid. */
      + '<div class="card xsell"><div class="k">Warrants</div><p>' + (ws.mentioned ? '<b>This filing mentions warrants</b>' + (ws.where ? ' (' + esc(ws.where) + ')' : '') + '.' : 'This read found no warrant language in this filing.')
      + ' Warrant analysis is the specialty of our sister site, Warrant Wire: the verdict, every warrant filing ' + esc(t) + ' has made, and what its warrant paper lets insiders and financiers do.</p>'
      + '<a class="xbtn" href="' + PAY + '/?go=wire_search_k8&ticker=' + encodeURIComponent(t) + '&on=wire&collect_email=1&from=' + encodeURIComponent(S) + '&ret=' + encodeURIComponent('/company.html?t=' + t) + '">Get the ' + esc(t) + ' warrant report on Warrant Wire &middot; $9.60 <span style="font-weight:400">(20% off because you bought this read, was $12)</span></a></div>'
      + sec("Changes in ownership", r.ownership_changes, function (x) { return '<li>' + esc(x.change) + (x.quote ? ' <q>' + esc(x.quote) + '</q>' : '') + '</li>'; })
      + '<div class="card"><div class="k">Can the company keep going?</div><p>' + (r.going_concern && r.going_concern.says_so ? '<b>The filing doubts it</b> &ndash; <q>' + esc(r.going_concern.quote) + '</q>' : 'The filing does not raise a going-concern doubt.') + '</p></div>'
      + sec("The tricky stuff", r.the_tricky_stuff, function (x) { return '<li>' + esc(x.what) + (x.quote ? ' <q>' + esc(x.quote) + '</q>' : '') + (x.where ? ' (' + esc(x.where) + ')' : '') + '</li>'; })
      + sec("Five questions to ask", r.five_questions, function (x) { return '<li>' + esc(x) + '</li>'; })
      + sec("What we could not check", r.checks_not_run, function (x) { return '<li>' + esc(x) + '</li>'; })
      + '<div class="rfoot">Facts and quotes are copied from the company&rsquo;s own SEC filing; what the filing does not say is listed as not checked. This is a reading of a public filing, not investment, legal or financial advice.' + (j.truncated ? ' The filing was very long; the read covers the parts that fit, listed above as not checked.' : '') + ' Licensed to one reader; see 8k10q.com/terms. 8K10Q &middot; 8k10q.com &middot; ' + LH.phone + ' &middot; ' + LH.email + '</div>'
      + '</div>' + copiesBox(j);
  }
})();
</script>
