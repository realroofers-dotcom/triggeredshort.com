<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Triggered Short</title>
<style>
:root{--ink:#12355B;--body:#1B2430;--muted:#5A6472;--rule:#DCE2E8;--panel:#F4F7FA;
      --accent:#B3202C;--teal:#1B7F79}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
     color:var(--body);background:#fff}
.top{border-bottom:1px solid var(--rule);padding:12px 18px;display:flex;gap:12px;align-items:center;
     background:var(--panel)}
.top b{color:var(--ink);font-size:16px}
.top input{padding:7px 10px;border:1px solid var(--rule);border-radius:4px;font:inherit;min-width:260px}
.top button{padding:7px 13px;border:0;background:var(--ink);color:#fff;border-radius:4px;cursor:pointer;
            font:600 13px Helvetica,Arial}
.wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 53px)}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.side{border-right:1px solid var(--rule);padding:12px;overflow-y:auto;background:#fff}
.side a{display:block;padding:7px 9px;border-radius:4px;text-decoration:none;color:var(--body);font-size:13.5px}
.side a:hover{background:var(--panel)}
.side a.on{background:var(--ink);color:#fff}
.main{padding:16px 18px;overflow-x:auto}
h2{margin:0 0 4px;font:700 18px Helvetica,Arial;color:var(--ink)}
.note{color:var(--muted);font-size:13px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--ink);color:#fff;text-align:left;padding:7px 9px;white-space:nowrap;
   position:sticky;top:0}
td{border-bottom:1px solid var(--rule);padding:5px 7px;vertical-align:top}
tr:nth-child(even) td{background:#FAFCFD}
td input,td textarea{width:100%;min-width:110px;border:1px solid transparent;background:transparent;
                     padding:4px 5px;font:inherit;border-radius:3px}
td input:focus,td textarea:focus{border-color:var(--teal);background:#fff;outline:none}
td.dirty input,td.dirty textarea{background:#FFFCEB;border-color:#E3C77A}
.pk{background:#EEF3F8;font-weight:700;color:var(--ink)}
.actions{white-space:nowrap}
.btn{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:4px 8px;cursor:pointer;
     font-size:12px;margin-right:4px}
.btn.save{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.del{color:var(--accent);border-color:#F0C9CD}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0}
.bar button{padding:7px 12px;border:0;background:var(--teal);color:#fff;border-radius:4px;cursor:pointer;
            font:600 13px Helvetica,Arial}
.msg{margin-left:auto;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:26px 0}
</style>
</head>
<body>

<div class="top">
  <b>Admin</b>
  <input id="api" placeholder="API base, e.g. https://room.triggeredshort.com">
  <input id="tok" type="password" placeholder="admin token">
  <button onclick="saveCreds()">Connect</button>
  <span class="msg" id="status"></span>
</div>

<div class="wrap">
  <aside class="side" id="tabs"><div class="empty">Connect to load tables.</div></aside>
  <main class="main" id="main"><div class="empty">Pick a table.</div></main>
</div>

<script>
let API = localStorage.getItem('ts_api') || '';
let TOK = localStorage.getItem('ts_admin') || '';
let META = {}, TABLE = null;

document.getElementById('api').value = API;
document.getElementById('tok').value = TOK;

const h = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const api = (p, opt={}) => fetch(API + p, {
  ...opt, headers: { 'content-type':'application/json', 'x-admin-token':TOK, ...(opt.headers||{}) }
}).then(r => r.json());

function say(t){ document.getElementById('status').textContent = t; }

function saveCreds(){
  API = document.getElementById('api').value.trim().replace(/\/$/,'');
  TOK = document.getElementById('tok').value.trim();
  localStorage.setItem('ts_api', API);
  localStorage.setItem('ts_admin', TOK);
  loadMeta();
}

async function loadMeta(){
  say('loading…');
  const d = await api('/api/meta');
  if (d.error){ say(d.error); return; }
  META = d.tables;
  document.getElementById('tabs').innerHTML =
    Object.entries(META).map(([t,c]) =>
      `<a href="#" class="${t===TABLE?'on':''}" onclick="openTable('${t}');return false">${h(c.label)}</a>`
    ).join('');
  say(Object.keys(META).length + ' tables');
}

async function openTable(t){
  TABLE = t;
  loadMeta();
  const cfg = META[t];
  const d = await api('/api/meta/' + t + '?limit=500');
  const rows = d.rows || [];
  const cols = cfg.columns.map(c => c.name);

  let html = `<h2>${h(cfg.label)}</h2>
    <div class="note">Table <code>${h(t)}</code> · key ${h(cfg.pk.join(' + '))} · ${rows.length} rows.
    Edit a cell then press Save on that row.</div>
    <div class="bar"><button onclick="addRow()">+ New row</button>
    <span class="msg" id="tmsg"></span></div>`;

  if (!rows.length){
    html += '<div class="empty">No rows yet.</div>';
  } else {
    html += '<table><thead><tr>' + cols.map(c=>`<th>${h(c)}</th>`).join('') +
            '<th>row</th></tr></thead><tbody>';
    rows.forEach((r,i) => {
      const key = cfg.pk.map(k => r[k]).join('~');
      html += `<tr data-key="${h(key)}">` + cols.map(c => {
        const isPk = cfg.pk.includes(c);
        const v = r[c] == null ? '' : r[c];
        const long = String(v).length > 60;
        const field = long
          ? `<textarea rows="2" data-col="${h(c)}" oninput="dirty(this)">${h(v)}</textarea>`
          : `<input data-col="${h(c)}" value="${h(v)}" ${isPk?'readonly':''} oninput="dirty(this)">`;
        return `<td class="${isPk?'pk':''}">${field}</td>`;
      }).join('') +
      `<td class="actions">
         <button class="btn save" onclick="saveRow(this)">Save</button>
         <button class="btn del" onclick="delRow(this)">Delete</button>
       </td></tr>`;
    });
    html += '</tbody></table>';
  }
  document.getElementById('main').innerHTML = html;
}

function dirty(el){ el.parentElement.classList.add('dirty'); }

function rowData(tr){
  const out = {};
  tr.querySelectorAll('[data-col]').forEach(el => {
    if (el.value !== '') out[el.dataset.col] = el.value;
  });
  return out;
}

async function saveRow(btn){
  const tr = btn.closest('tr');
  const key = tr.dataset.key;
  const d = await api('/api/meta/' + TABLE + '/' + encodeURIComponent(key),
    { method:'PATCH', body: JSON.stringify(rowData(tr)) });
  document.getElementById('tmsg').textContent = d.error ? d.error : 'saved';
  tr.querySelectorAll('td').forEach(td => td.classList.remove('dirty'));
}

async function delRow(btn){
  const tr = btn.closest('tr');
  if (!confirm('Delete this configuration row?')) return;
  const d = await api('/api/meta/' + TABLE + '/' + encodeURIComponent(tr.dataset.key),
    { method:'DELETE' });
  if (d.error) { document.getElementById('tmsg').textContent = d.error; return; }
  openTable(TABLE);
}

async function addRow(){
  const cfg = META[TABLE];
  const body = {};
  for (const c of cfg.columns){
    if (cfg.autoId && cfg.pk.includes(c.name)) continue;
    if (c.notnull && c.dflt == null){
      const v = prompt(`${TABLE}.${c.name} (${c.type}) — required`);
      if (v === null) return;
      body[c.name] = v;
    }
  }
  const d = await api('/api/meta/' + TABLE, { method:'POST', body: JSON.stringify(body) });
  if (d.error) { alert(d.error); return; }
  openTable(TABLE);
}

if (API && TOK) loadMeta();
</script>
</body>
</html>
